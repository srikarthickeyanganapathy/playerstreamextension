<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>FastStream Player</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="player.css">
    <link rel="stylesheet" href="ui_extensions.css">

    <!-- HLS.js for HLS stream support (bundled locally for MV3 CSP compliance) -->
    <script src="lib/hls.min.js"></script>

    <!-- Dash.js for DASH stream support (bundled locally for MV3 CSP compliance) -->
    <script src="lib/dash.all.min.js"></script>
</head>

<body>
    <div class="player-container" id="playerContainer">
        <!-- Video Element -->
        <video id="video-player" playsinline webkit-playsinline x5-playsinline preload="metadata"></video>

        <!-- Tap Area for Controls Toggle -->
        <div class="tap-area" id="tapArea"></div>

        <!-- Video Detected Badge -->
        <div class="stream-info pill-bg" id="streamInfoBadge">
            <span style="color: #4CAF50; margin-right: 6px;">⚡</span>
            <span id="streamType">Video Detected</span>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
        </div>

        <!-- Error Overlay -->
        <div class="error-overlay" id="errorOverlay">
            <div class="error-icon">⚠️</div>
            <div class="error-message" id="errorMessage">Failed to load video</div>
            <div class="error-details" id="errorDetails"></div>
            <div class="error-actions">
                <button class="error-btn primary" id="copyUrlBtn">📋 Copy URL</button>
                <button class="error-btn secondary" id="retryBtn">🔄 Retry</button>
            </div>
        </div>

        <!-- Copy Toast Notification -->
        <div class="copy-toast" id="copyToast">URL copied to clipboard!</div>

        <!-- Controls Overlay -->
        <div class="controls-overlay" id="controlsOverlay">
            <!-- Progress Bar -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-buffered" id="progressBuffered"></div>
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-thumb" id="progressThumb"></div>
            </div>

            <!-- Control Buttons -->
            <div class="controls-row">
                <div class="controls-left">
                    <!-- Play/Pause Pill -->
                    <button class="control-pill icon-btn" id="playBtn">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M8 5v14l11-7z" id="playIconPath"/>
                        </svg>
                    </button>
                    <!-- Skip Pill -->
                    <button class="control-pill icon-btn" id="forwardBtn" title="Forward 10s">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="13 19 22 12 13 5 13 19"></polygon>
                            <polygon points="2 19 11 12 2 5 2 19"></polygon>
                        </svg>
                    </button>
                    <!-- Volume Pill -->
                    <div class="control-pill volume-pill-wrapper">
                        <button class="icon-btn" id="muteBtn" title="Mute (m)">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" id="volumeIconLines"></path>
                            </svg>
                        </button>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                    </div>
                    <!-- Time Pill -->
                    <div class="control-pill time-pill">
                        <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
                    </div>
                </div>

                <div class="controls-right">
                    <!-- Grouped Right Pills -->
                    <div class="control-pill grouped-pills">
                        <button class="icon-btn" id="sourcesBtn" title="Sources">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #F8C537;">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                            </svg>
                        </button>
                        <button class="icon-btn" id="ccBtn" title="Subtitles">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #BB86FC;">
                                <rect x="3" y="5" width="18" height="14" rx="2" ry="2"></rect>
                                <path d="M7 15h3M14 15h3M7 11h3M14 11h3"></path>
                            </svg>
                        </button>
                        <div class="quality-selector-wrapper">
                            <select class="quality-selector hidden-select" id="qualitySelector">
                                <option value="-1">Auto</option>
                            </select>
                            <button class="icon-btn" id="settingsBtn" title="Quality">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                </svg>
                            </button>
                        </div>
                        <button class="icon-btn" id="castBtn" title="Cast">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"></path>
                                <line x1="2" y1="20" x2="2.01" y2="20"></line>
                            </svg>
                        </button>
                        <button class="icon-btn" id="pipBtn" title="Picture-in-Picture">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="14" rx="2" ry="2"></rect>
                                <rect x="12" y="11" width="7" height="4"></rect>
                            </svg>
                        </button>
                        <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="main.mjs"></script>
</body>

</html>
